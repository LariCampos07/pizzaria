<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Tony Pizzaria</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background: #FFFEF2; }
header {
    display:flex; justify-content:space-between; align-items:center;
    padding: 20px 50px; background: #FFFEF2;
}
.logo { color:#b33a00; font-weight:bold; font-size:18px; }
nav a { margin-left:20px; text-decoration:none; color:#333; }
.conteudo {
    display:flex; justify-content:space-between; align-items:center;
    padding: 40px 50px;
    background: linear-gradient(90deg, #FFFEF2 55%, #FFC77E 55%);
    min-height: 90vh;
}
.texto h1 { font-size: 52px; line-height: 1.1; color: #222; }
.texto h1 span { color: #E07A5F; font-weight: normal; }
.pizza-grande img {
    width: 450px; height: 450px;
    border-radius: 50%; object-fit: cover;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.pizzas-pequenas { display:flex; gap:15px; margin-top: 50px; }
.pizzas-pequenas img {
    width: 130px; height: 90px; object-fit:cover;
    border-radius:10px; border: 2px solid transparent;
}
</style>
</head>
<body>

<header>
    <div class="logo">🍕 Tony Pizzaria</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Cardápio</a>
        <a href="#">Serviços</a>
        <a href="#">Localização</a>
        <a href="#">Contato</a>
    </nav>
</header>

<section class="conteudo">
    <div class="texto">
        <h1>Não é apenas<br>uma <span>Pizza</span>, é<br>uma experiência!</h1>

        <div class="pizzas-pequenas">
            <img src="./img/pizza2.png">
            <img src="./img/pizza3.png">
            <img src="./img/pizza4.png">
            <img src="./img/pizzza5.png">
        </div>
    </div>

    <div class="pizza-grande">
        <img src="./img/calabresa.png">
    </div>
</section>

</body>
</html>
